<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="nb2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c7cff"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nword" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".6" stop-color="#dfe4ff"/>
      <stop offset="1" stop-color="#c9b8ff"/>
    </linearGradient>
  </defs>

  <!-- emblem tile -->
  <rect x="6" y="6" width="348" height="348" rx="74" fill="url(#nb2)"/>
  <rect x="6" y="6" width="348" height="348" rx="74" fill="url(#glow2)"/>
  <rect x="6" y="6" width="348" height="348" rx="74" fill="none" stroke="#ffffff" stroke-opacity=".20" stroke-width="3"/>

  <!-- letter N -->
  <g fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 106 V252"/>
    <path d="M240 106 V252"/>
    <path d="M120 252 L240 106"/>
  </g>

  <!-- cross sparkle -->
  <path fill="#ffffff" d="M285 52 L290 61 L299 66 L290 71 L285 80 L280 71 L271 66 L280 61 Z"/>

  <!-- wordmark -->
  <text x="392" y="208" font-family="'Segoe UI', Arial, sans-serif" font-size="150" font-weight="900" fill="url(#nword)" letter-spacing="4">Noor</text>
  <text x="400" y="280" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="700" fill="#9aa6c8" letter-spacing="14">TUITION CENTER</text>
</svg>