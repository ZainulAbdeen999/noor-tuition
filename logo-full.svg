<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="348" y2="348" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="45%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#fff" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <!-- emblem -->
  <rect x="6" y="6" width="348" height="348" rx="80" fill="url(#bg)"/>
  <rect x="6" y="6" width="348" height="348" rx="80" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>

  <!-- book pages behind N -->
  <g opacity="0.2" fill="#fff">
    <path d="M36,198 Q36,188 68,186 L118,288 L36,306 Z"/>
    <path d="M324,198 Q324,188 292,186 L242,288 L324,306 Z"/>
  </g>

  <!-- main N letter -->
  <g fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M118 102 V270"/>
    <path d="M242 102 V270"/>
    <path d="M118 270 L242 102"/>
  </g>

  <!-- golden star -->
  <g transform="translate(180,60)">
    <polygon points="0,-34 8,-11 34,-11 13,4 20,31 0,15 -20,31 -13,4 -34,-11 -8,-11" fill="url(#star)" filter="url(#glow)"/>
  </g>

  <!-- sparkle -->
  <path fill="#fff" opacity="0.75" d="M302,38 L307,50 L319,55 L307,60 L302,72 L297,60 L285,55 L297,50Z"/>

  <!-- wordmark -->
  <text x="396" y="198" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="148" font-weight="900" fill="url(#txt)" letter-spacing="4">Noor</text>
  <text x="402" y="268" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#5eead4" letter-spacing="14">TUITION CENTER</text>
</svg>
